{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}

  {{ with .Pages }}
    <ul class="entry-list">
      {{ range . }}
        <li>
          <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
          {{ with .Description }}<p>{{ . }}</p>{{ end }}
        </li>
      {{ end }}
    </ul>
  {{ else }}
    <p>Nothing here yet.</p>
  {{ end }}
{{ end }}
