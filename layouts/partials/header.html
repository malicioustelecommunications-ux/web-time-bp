<header class="sheet-head">
  {{ partial "brand.html" . }}
  <nav class="sheet-nav" aria-label="Main">
    {{- $current := . }}
    {{- range $i, $m := site.Menus.main }}
      {{- if $i }}<span class="slash" aria-hidden="true">/</span>{{ end -}}
      <a href="{{ $m.URL }}"{{ if or ($current.IsMenuCurrent "main" $m) ($current.HasMenuCurrent "main" $m) }} class="active" aria-current="page"{{ end }}>{{ $m.Name }}</a>
    {{- end }}
  </nav>
  <span class="sheet-no">{{ partial "sheet-number.html" . }}</span>
</header>
