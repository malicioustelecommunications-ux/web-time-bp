{{ define "main" }}
  {{ .Content }}

  {{ $recent := first 5 (where site.RegularPages "Section" "in" (slice "work" "paper" "sound")) }}
  {{ with $recent }}
    <h2>Recent</h2>
    <ul class="entry-list">
      {{ range . }}
        <li>
          <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
          <span class="tag">{{ .Section }}</span>
        </li>
      {{ end }}
    </ul>
  {{ end }}
{{ end }}
