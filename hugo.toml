baseURL = "https://example.org/"
languageCode = "en-gb"
title = "Your Name"
disableKinds = ["taxonomy", "term"]

[params]
  description = "Work, writing and sound."
  author = "Your Name"
  # The reversed box next to the title in the header and footer.
  tagline = "portfolio"
  # Sheet number shown top and bottom right. Sections and pages can set their own with `sheet` in front matter.
  sheet = "2926"
  printedIn = "London"

[menus]
  [[menus.main]]
    name = "Work"
    pageRef = "/work"
    weight = 10
  [[menus.main]]
    name = "Paper"
    pageRef = "/paper"
    weight = 20
  [[menus.main]]
    name = "Sound"
    pageRef = "/sound"
    weight = 30
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 40

[markup.goldmark.renderer]
  unsafe = true
